# GitHub에 올려두면 서버에서 APK를 빌드해 준다.
# Actions 탭 → 실행 결과 → Artifacts에서 apk를 받을 수 있다.
# Android Studio로 직접 빌드한다면 이 파일은 없어도 된다.
name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4

      - name: 단위 테스트
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: 디버그 APK 빌드
        run: ./gradlew assembleDebug --stacktrace

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: nihongo-masu-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: 테스트 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
